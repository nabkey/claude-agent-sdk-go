name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor declared in go.mod, and the latest release. Testing both
        # keeps the floor honest: code needing a newer Go fails on 1.26 here
        # rather than for a consumer.
        go-version: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # Action v6 installs golangci-lint v1, which cannot read the v2 config
      # schema; v7+ install v2. Both the action and the tool are pinned so a
      # new release cannot move one side without the other.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
