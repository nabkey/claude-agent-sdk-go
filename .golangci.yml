# golangci-lint v2 configuration. CI installs the latest release, which no
# longer reads the v1 schema; gosimple and typecheck are folded into
# staticcheck there and are not listed separately.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: true
