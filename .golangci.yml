# golangci-lint v2 configuration, pinned alongside the tool version in
# .github/workflows/ci.yml -- the v1 and v2 config schemas are mutually
# incompatible, so the two have to move together.
#
# gosimple and typecheck are folded into staticcheck in v2 and are not listed
# separately.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: true
